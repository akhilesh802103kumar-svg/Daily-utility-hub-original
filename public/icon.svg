<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1456D9" />
      <stop offset="100%" stop-color="#6D35D5" />
    </linearGradient>

    <!-- Toolbox Body Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Toolbox Tray/Inner Gradient -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Orange/Yellow Orbit & Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FF9D24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Metallic Handle Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Safe Margin for Maskable Icons -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="6 8" />

  <!-- Outer Orbit Swoosh Ring -->
  <path d="M 90 320 C 70 210, 180 90, 340 100 C 440 106, 460 200, 420 270 C 390 320, 310 400, 170 390" 
        fill="none" stroke="url(#boltGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#glowFilter)" />
  <circle cx="410" cy="140" r="7" fill="#FDE047" filter="url(#glowFilter)" />
  <circle cx="120" cy="340" r="5" fill="#FF9D24" />

  <!-- The Toolbox Main Group -->
  <g filter="url(#shadowFilter)">
    <!-- Toolbox Handle (Top) -->
    <path d="M 196 150 C 196 125, 316 125, 316 150 L 316 175 L 290 175 L 290 155 C 290 145, 222 145, 222 155 L 222 175 L 196 175 Z" 
          fill="url(#metalGrad)" stroke="#64748B" stroke-width="2" />

    <!-- Toolbox Upper Lid -->
    <rect x="136" y="172" width="240" height="42" rx="12" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="2" />
    <line x1="148" y1="184" x2="364" y2="184" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Left & Right Latches -->
    <rect x="172" y="186" width="24" height="24" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5" />
    <rect x="316" y="186" width="24" height="24" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5" />

    <!-- Toolbox Main Body -->
    <rect x="146" y="206" width="220" height="175" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <rect x="154" y="214" width="204" height="159" rx="12" fill="#1E293B" />

    <!-- Internal 4 Tool Quadrants (PDF, Image, QR, Calculator) -->

    <!-- Quadrant 1: PDF Tool Symbol (Top-Left) -->
    <g transform="translate(168, 226)">
      <rect width="80" height="66" rx="8" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1.5" />
      <!-- PDF Document Icon -->
      <path d="M 26 14 L 46 14 L 54 22 L 54 50 C 54 52, 52 54, 50 54 L 26 54 C 24 54, 22 52, 22 50 L 22 18 C 22 16, 24 14, 26 14 Z" fill="#F87171" />
      <path d="M 46 14 L 46 22 L 54 22 Z" fill="#FCA5A5" />
      <!-- Text lines inside doc -->
      <line x1="28" y1="28" x2="42" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="28" y1="36" x2="48" y2="36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Small PDF tag -->
      <rect x="25" y="42" width="26" height="8" rx="2" fill="#991B1B" />
      <text x="38" y="48" font-family="sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle">PDF</text>
    </g>

    <!-- Quadrant 2: Image Tool Symbol (Top-Right) -->
    <g transform="translate(264, 226)">
      <rect width="80" height="66" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5" />
      <!-- Image frame with mountains & sun -->
      <rect x="20" y="15" width="40" height="34" rx="5" fill="#047857" stroke="#34D399" stroke-width="1.5" />
      <!-- Sun -->
      <circle cx="32" cy="24" r="3.5" fill="#FDE047" />
      <!-- Mountain Peaks -->
      <path d="M 23 45 L 34 32 L 42 41 L 48 35 L 57 45 Z" fill="#A7F3D0" />
    </g>

    <!-- Quadrant 3: QR Code Symbol (Bottom-Left) -->
    <g transform="translate(168, 300)">
      <rect width="80" height="66" rx="8" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1.5" />
      <!-- Mini QR Finder corners & data bits -->
      <g transform="translate(23, 14)">
        <!-- Top-Left Finder -->
        <rect x="0" y="0" width="14" height="14" rx="2" fill="none" stroke="#818CF8" stroke-width="2" />
        <rect x="3.5" y="3.5" width="7" height="7" rx="1" fill="#C7D2FE" />
        <!-- Top-Right Finder -->
        <rect x="20" y="0" width="14" height="14" rx="2" fill="none" stroke="#818CF8" stroke-width="2" />
        <rect x="23.5" y="3.5" width="7" height="7" rx="1" fill="#C7D2FE" />
        <!-- Bottom-Left Finder -->
        <rect x="0" y="20" width="14" height="14" rx="2" fill="none" stroke="#818CF8" stroke-width="2" />
        <rect x="3.5" y="23.5" width="7" height="7" rx="1" fill="#C7D2FE" />
        <!-- Data dots -->
        <rect x="20" y="20" width="4" height="4" fill="#A5B4FC" />
        <rect x="28" y="20" width="5" height="5" fill="#C7D2FE" />
        <rect x="20" y="28" width="5" height="5" fill="#C7D2FE" />
        <rect x="29" y="28" width="4" height="4" fill="#818CF8" />
        <rect x="15" y="9" width="3" height="3" fill="#A5B4FC" />
        <rect x="9" y="15" width="3" height="3" fill="#A5B4FC" />
      </g>
    </g>

    <!-- Quadrant 4: Calculator Symbol (Bottom-Right) -->
    <g transform="translate(264, 300)">
      <rect width="80" height="66" rx="8" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5" />
      <!-- Calculator Body -->
      <rect x="24" y="14" width="32" height="38" rx="4" fill="#B45309" stroke="#FBBF24" stroke-width="1.5" />
      <!-- Calculator Screen -->
      <rect x="28" y="18" width="24" height="8" rx="2" fill="#1E293B" />
      <text x="49" y="24.5" font-family="monospace" font-size="6" font-weight="bold" fill="#34D399" text-anchor="end">88.5</text>
      <!-- Keypad Grid (2x3 dots) -->
      <circle cx="31" cy="30" r="1.5" fill="#FDE68A" />
      <circle cx="37" cy="30" r="1.5" fill="#FDE68A" />
      <circle cx="43" cy="30" r="1.5" fill="#FDE68A" />
      <circle cx="49" cy="30" r="1.5" fill="#F59E0B" />
      <circle cx="31" cy="36" r="1.5" fill="#FDE68A" />
      <circle cx="37" cy="36" r="1.5" fill="#FDE68A" />
      <circle cx="43" cy="36" r="1.5" fill="#FDE68A" />
      <circle cx="49" cy="36" r="1.5" fill="#F59E0B" />
      <circle cx="31" cy="42" r="1.5" fill="#FDE68A" />
      <circle cx="37" cy="42" r="1.5" fill="#FDE68A" />
      <circle cx="43" cy="42" r="1.5" fill="#F59E0B" />
      <circle cx="49" cy="42" r="1.5" fill="#10B981" />
    </g>
  </g>

  <!-- Energetic Dynamic Lightning Bolt Across Lower Right of Toolbox -->
  <g filter="url(#glowFilter)" transform="translate(325, 275) rotate(-15) scale(0.95)">
    <!-- Lightning Bolt Shape -->
    <polygon points="40,-45 -10,10 20,12 -25,75 50,15 15,10" 
             fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- Sparkles / Twinkles -->
  <path d="M 120 180 Q 120 195 105 195 Q 120 195 120 210 Q 120 195 135 195 Q 120 195 120 180 Z" fill="#FDE047" />
  <path d="M 400 370 Q 400 380 390 380 Q 400 380 400 390 Q 400 380 410 380 Q 400 380 400 370 Z" fill="#FDE047" />
  <path d="M 360 85 Q 360 95 350 95 Q 360 95 360 105 Q 360 95 370 95 Q 360 95 360 85 Z" fill="#FFFFFF" opacity="0.8" />
</svg>
